<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Ilha Flutuante</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #8fd3ff;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game { width: 100%; height: 100%; background: linear-gradient(#8fd3ff, #fde2f3); }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #8fd3ff;
        color: #3b2a4a;
        font: 700 22px/1.4 system-ui, sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱↻<br />Gire o celular para jogar deitado</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
